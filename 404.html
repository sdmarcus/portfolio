<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sam Marcus Portfolio</title>
  <script type="text/javascript">
    // GitHub Pages serves this file for any unmatched path (e.g. /portfolio/photos).
    // Re-encode the real path into a query string and redirect to index.html, which
    // decodes it back into the URL before the app boots. See:
    // https://github.com/rafgraph/spa-github-pages
    var pathSegmentsToKeep = 1; // keep "/portfolio"

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>

<body>
</body>

</html>
