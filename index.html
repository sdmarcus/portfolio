  <script type="text/javascript">
    // Decode the path GitHub Pages' 404.html redirect encoded into the query
    // string, restoring the real URL before the app boots. See public/404.html
    // and https://github.com/rafgraph/spa-github-pages
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>
